name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default: this workflow never pushes, never writes packages and
# never needs a token beyond checking out the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Static drift check: every process.env key the code reads must be
      # documented in .env.example. No secrets required.
      - name: Environment contract
        run: npm run check:env

      # next-env.d.ts is gitignored, so a fresh checkout has none until
      # something generates it — it carries the `next/image-types` reference
      # that types `*.png` imports (components/brand-mark.tsx) and the route
      # type imports. Without this, `tsc --noEmit` failed with TS2307 on a
      # clean clone while passing locally. `next typegen` produces the same
      # artifacts `next build` would, without running a full build.
      - name: Generate Next.js type artifacts
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      # Coverage run doubles as the unit gate: the text reporter prints the
      # usual summary, the JSON report feeds the doc-count check, and the
      # vitest thresholds (74% statements / 64% branches) fail the job if the
      # server-side surface regresses.
      - name: Unit tests (coverage)
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=unit-results.json

      # Doc/test drift: README suite line, README file tables, and the
      # SECURITY.md per-file counts must match what actually exists.
      - name: Documentation counts
        run: npm run check:counts -- --unit-json=unit-results.json

      - name: Documentation links
        run: npm run check:links

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

      # No environment variables on purpose: the build must not depend on a
      # reachable Supabase project, and no secrets exist in this repository.
      - name: Build
        run: npm run build

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uses the pinned supabase CLI from devDependencies (2.119.0), so the
      # stack version matches local development exactly.
      - name: Start local Supabase
        run: npx supabase start

      - name: Read stack endpoints
        run: |
          npx supabase status -o json > /tmp/supabase-status.json
          API_URL=$(node -p "require('/tmp/supabase-status.json').API_URL")
          PUBLISHABLE_KEY=$(node -p "require('/tmp/supabase-status.json').PUBLISHABLE_KEY")
          echo "::add-mask::$PUBLISHABLE_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      - name: Wait for the API to accept requests
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/health" || true)
            if [ "$code" = "200" ]; then
              echo "API ready after $attempt attempt(s)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 2
          done
          echo "Supabase API never became ready" >&2
          exit 1

      - name: Apply migrations from scratch
        run: npx supabase db reset

      - name: Run integration tests
        run: npm run test:integration -- --reporter=default --reporter=json --outputFile.json=integration-results.json

      # SECURITY.md per-file integration counts and the integration README
      # totals are only checkable against a real run's JSON, so this gate
      # lives here rather than in the quality job.
      - name: Documentation counts (integration)
        run: npm run check:counts -- --integration-json=integration-results.json

      # Production-shape gate: the same build operators run, probed by the
      # smoke script (health, readiness, metrics, request-id envelope).
      - name: Build for smoke
        run: npm run build

      - name: Smoke-check the production build
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Server ready after $attempt attempt(s)"
              break
            fi
            sleep 1
          done
          npm run smoke

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: Browser e2e tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uses the pinned supabase CLI from devDependencies (2.119.0), so the
      # stack version matches local development exactly.
      - name: Start local Supabase
        run: npx supabase start

      - name: Read stack endpoints
        run: |
          npx supabase status -o json > /tmp/supabase-status.json
          API_URL=$(node -p "require('/tmp/supabase-status.json').API_URL")
          PUBLISHABLE_KEY=$(node -p "require('/tmp/supabase-status.json').PUBLISHABLE_KEY")
          echo "::add-mask::$PUBLISHABLE_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      - name: Wait for the API to accept requests
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/health" || true)
            if [ "$code" = "200" ]; then
              echo "API ready after $attempt attempt(s)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 2
          done
          echo "Supabase API never became ready" >&2
          exit 1

      - name: Apply migrations from scratch
        run: npx supabase db reset

      # Chromium only; the exact browser build is pinned by @playwright/test.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
